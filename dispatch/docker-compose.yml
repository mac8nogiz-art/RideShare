version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

  dispatch-zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: dispatch-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - app-network

  dispatch-kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: dispatch-kafka
    depends_on:
      - dispatch-zookeeper  # Simple dependency without healthcheck condition
    ports:
      - "9093:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: dispatch-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
    networks:
      - app-network

  dispatch-service:
    build: .
    container_name: dispatch-service
    depends_on:
      - redis
      - dispatch-kafka
    ports:
      - "4005:4005"
    environment:
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      KAFKA_BROKER: localhost:9092
      PORT: 4005  # ADD THIS
    volumes:
      - .:/app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  redis_data: